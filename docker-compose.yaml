services:
  homepage:
    build: .
    container_name: homepage
    restart: always
    volumes:
      - ./home-page/:/home-page
    ports:
      - "4869:4869"
    environment:
      - SERVER_HOST=192.168.50.71
      - NEXT_PUBLIC_BASE_DOMAIN=castamerego.com
    networks:
      - default
      - clash_default
      - clickhouse_default

networks:
  clash_default:
    external: true
  clickhouse_default:
    external: true
